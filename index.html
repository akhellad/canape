<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#130f1d">
<title>Canapé</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root {
  --bg: #130f1d;
  --panel: #241c3a;
  --line: #3a2f57;
  --text: #f6f2ff;
  --muted: #a597c7;
  --p0: #5cc8ff;
  --p1: #ffb35c;
  --good: #4fe08f;
  --bad: #ff5d7d;
  --primary: #ff5d8f;
  --t0: #e9465a;
  --t1: #3c8cff;
  --t2: #e9a81c;
  --t3: #22ad63;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  min-height: 100%;
  background:
    radial-gradient(1200px 800px at 15% -10%, #2a1d4a 0%, transparent 60%),
    radial-gradient(900px 700px at 110% 110%, #3a1530 0%, transparent 55%),
    var(--bg);
  background-attachment: fixed;
  color: var(--text);
  font-family: 'Nunito', system-ui, sans-serif;
  -webkit-tap-highlight-color: transparent;
}
h1, h2, .brand, .signal, .btn, .bigtap, .letter, .score strong, .timer { font-family: 'Fredoka', 'Nunito', sans-serif; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
.brand { font-size: 1.6em; font-weight: 700; }
.brand span { color: var(--primary); }
.muted { color: var(--muted); }
.p0 { --pc: var(--p0); --ps: rgba(92, 200, 255, .22); }
.p1 { --pc: var(--p1); --ps: rgba(255, 179, 92, .22); }
.t0 { --tc: var(--t0); }
.t1 { --tc: var(--t1); }
.t2 { --tc: var(--t2); }
.t3 { --tc: var(--t3); }
@keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
@keyframes pop { from { opacity: 0; transform: scale(.85); } to { opacity: 1; transform: none; } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes pulse { 50% { transform: scale(1.6); opacity: .4; } }

.tv { height: 100vh; display: flex; flex-direction: column; padding: 3vh 3.5vw; gap: 2vh; font-size: clamp(14px, 1.45vw, 44px); overflow: hidden; }
.bar { display: flex; align-items: center; gap: 2vw; }
.players { display: flex; gap: 1vw; margin-left: auto; }
.pchip { display: flex; align-items: center; gap: .6em; padding: .45em .9em; border-radius: 999px; background: var(--panel); border: 2px solid var(--pc, var(--line)); font-weight: 800; }
.pchip .dot { width: .6em; height: .6em; border-radius: 50%; background: var(--good); }
.pchip.off { opacity: .6; }
.pchip.off .dot { background: var(--bad); }
.pchip b { background: var(--pc); color: var(--bg); border-radius: 999px; padding: 0 .55em; font-size: .85em; }
.pchip.empty { color: var(--muted); border-style: dashed; }
.code { color: var(--muted); font-weight: 700; }
.code b { color: var(--text); letter-spacing: .15em; }
.tv-main { flex: 1; display: flex; align-items: center; justify-content: center; min-height: 0; }

.stage { width: 100%; max-width: 1500px; display: flex; flex-direction: column; gap: 2.2vh; animation: rise .35s ease-out; }
.stage.board { align-items: center; max-width: none; }
.board-head { min-height: 3.4em; display: flex; align-items: center; justify-content: center; gap: 1.5vw; flex-wrap: wrap; }
.board-row { display: flex; align-items: center; justify-content: center; gap: 3vw; }
.turn { display: inline-flex; align-items: center; gap: .6em; padding: .5em 1.2em; border-radius: 999px; background: var(--ps); border: 2px solid var(--pc); font-weight: 800; font-size: 1.15em; }
.turn b { color: var(--pc); }
.pulse { width: .6em; height: .6em; border-radius: 50%; background: var(--pc); animation: pulse 1.2s ease-in-out infinite; }
.note { font-weight: 800; font-size: 1.15em; animation: pop .35s ease-out; }
.endbar { display: flex; flex-direction: column; align-items: center; gap: .1em; padding: .5em 1.6em; border-radius: 1em; background: linear-gradient(90deg, rgba(255, 93, 143, .22), rgba(255, 179, 92, .22)); border: 2px solid rgba(255, 255, 255, .15); animation: pop .4s ease-out; }
.endbar b { font-family: 'Fredoka', sans-serif; font-size: 1.5em; }
.endbar span { color: var(--muted); font-weight: 700; }
.topline { display: flex; justify-content: space-between; align-items: center; }
.kicker { color: var(--muted); font-weight: 800; text-transform: uppercase; letter-spacing: .12em; font-size: .85em; }
.timer { font-size: 2em; font-weight: 700; min-width: 2.2em; text-align: center; padding: .1em .4em; border-radius: .4em; background: var(--panel); }
.lead { font-size: 1.4em; color: var(--muted); font-weight: 800; }
.question { font-size: 2.6em; line-height: 1.15; font-weight: 600; animation: pop .35s ease-out; }
.options { display: grid; grid-template-columns: 1fr 1fr; gap: 1.4vw; }
.option { display: flex; align-items: center; flex-wrap: wrap; gap: .8em; padding: 1em 1.2em; border-radius: 1em; background: var(--tc); font-size: 1.35em; font-weight: 800; transition: opacity .3s, transform .3s, box-shadow .3s; }
.option.dim { opacity: .28; }
.option.correct { transform: scale(1.03); box-shadow: 0 0 0 .18em #fff; }
.letter { display: grid; place-items: center; width: 1.9em; height: 1.9em; border-radius: .5em; background: rgba(0, 0, 0, .25); font-weight: 700; }
.otext { flex: 1; }
.tag { font-style: normal; font-size: .75em; padding: .2em .7em; border-radius: 999px; background: var(--pc); color: var(--bg); font-weight: 800; }
.chips { display: flex; gap: 1vw; justify-content: center; flex-wrap: wrap; }
.chip { padding: .5em 1.1em; border-radius: 999px; border: 2px dashed var(--pc); color: var(--pc); font-weight: 800; }
.chip.done { border-style: solid; background: var(--pc); color: var(--bg); }
.scoreboard { display: flex; justify-content: center; gap: 2vw; }
.score { display: flex; align-items: center; gap: .8em; padding: .5em 1.2em; border-radius: .8em; background: var(--panel); border-bottom: .25em solid var(--pc); font-weight: 800; }
.score strong { font-size: 1.6em; }
.verdict { text-align: center; font-family: 'Fredoka', sans-serif; font-size: 2em; font-weight: 600; padding: .5em; border-radius: .6em; animation: pop .35s ease-out; }
.verdict.good { background: rgba(79, 224, 143, .14); color: var(--good); }
.verdict.bad { background: rgba(255, 93, 125, .14); color: var(--bad); }
.votes { display: grid; grid-template-columns: 1fr 1fr; gap: 2vw; }
.vote { padding: 1.2em; border-radius: 1em; background: var(--panel); border-top: .3em solid var(--pc); display: flex; flex-direction: column; gap: .3em; text-align: center; }
.vote span { color: var(--muted); font-weight: 800; }
.vote strong { font-family: 'Fredoka', sans-serif; font-size: 2em; }

.reflex { flex: 1; align-self: stretch; border-radius: 1.5em; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3vh; }
.reflex.wait { background: #5a1424; }
.reflex.go { background: #16a34a; }
.reflex.result { background: var(--panel); }
.signal { font-size: 6em; font-weight: 700; text-align: center; line-height: 1; padding: 0 .5em; }
.hint { font-size: 1.5em; font-weight: 800; opacity: .85; min-height: 1.4em; }

.gb { display: grid; }
.gb > * { position: relative; }

.c4 { grid-template-columns: repeat(7, 1fr); grid-template-rows: repeat(6, 1fr); gap: 3%; padding: 3%; aspect-ratio: 7 / 6; background: linear-gradient(#3557e8, #2443c4); border-radius: 1em; overflow: hidden; box-shadow: 0 1em 2em rgba(0, 0, 0, .35); }
.c4 .cell { border-radius: 50%; background: var(--bg); box-shadow: inset 0 .25em .4em rgba(0, 0, 0, .6); }
.c4 .cell.p0, .c4 .cell.p1 { background: radial-gradient(circle at 35% 30%, rgba(255, 255, 255, .45), transparent 45%), var(--pc); box-shadow: inset 0 -.25em 0 rgba(0, 0, 0, .25); animation: drop .45s cubic-bezier(.45, 0, .9, .6); }
.c4 .cell.win { animation: glow .8s ease-in-out infinite alternate; }
@keyframes drop { from { transform: translateY(-700%); } to { transform: none; } }
@keyframes glow { to { box-shadow: 0 0 0 .25em #fff, 0 0 1.2em #fff; } }
.tv .c4 { height: 66vh; }

.sea { grid-template-columns: repeat(8, 1fr); grid-template-rows: repeat(8, 1fr); gap: 3px; aspect-ratio: 1; padding: 6px; background: #0a2540; border-radius: .8em; transition: box-shadow .3s; }
.sea .cell { background: #13406b; border-radius: 4px; }
.sea button.cell { background: #1a5288; }
.sea .cell.ship { background: #7d8ea6; }
.sea .cell.miss::after { content: ''; position: absolute; inset: 36%; border-radius: 50%; background: #cfe3ff; }
.sea .cell.hit { background: #ff4d4d; animation: boom .4s ease-out; }
.sea .cell.hit::after { content: ''; position: absolute; inset: 30%; border-radius: 50%; background: #ffd2d2; }
.sea .cell.sunk { background: #8a1328; }
.sea .cell.last { box-shadow: 0 0 0 3px #fff; z-index: 1; }
@keyframes boom { from { transform: scale(1.5); } to { transform: none; } }
.tv .sea { height: 54vh; gap: .35vh; padding: .8vh; }
.fleet { display: flex; flex-direction: column; gap: 1vh; }
.fleet-head { display: flex; justify-content: space-between; gap: 1em; font-weight: 800; font-size: 1.15em; border-bottom: .2em solid var(--pc); padding-bottom: .3em; }
.fleet-head em { font-style: normal; color: var(--muted); }
.fleet.target .sea { box-shadow: 0 0 0 .25em var(--pc); }

.pond { grid-template-columns: repeat(9, 1fr); grid-template-rows: repeat(9, 1fr); gap: .3em; aspect-ratio: 1; padding: .5em; background: #1d4d3a; border-radius: 1em; }
.pond .sq { background: #2f7a59; border-radius: .35em; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; }
.pond .sq.start { background: var(--pc); }
.pond .sq.lane { background: var(--ps); border: 2px solid var(--pc); }
.pond .sq.mare { background: radial-gradient(#5ec8ff, #2a7fd4); border-radius: 50%; }
.tv .pond { height: 68vh; }
.duck { position: relative; display: block; width: 78%; aspect-ratio: 1; }
.crowd .duck { width: 46%; }
.duck svg { display: block; width: 100%; height: 100%; fill: var(--pc); filter: drop-shadow(0 .1em .1em rgba(0, 0, 0, .4)); }
.duck .beak { fill: #ff9f1c; }
.duck .eye { fill: var(--bg); }
.duck i { position: absolute; right: -8%; bottom: -8%; min-width: 1.4em; padding: 0 .2em; border-radius: 999px; background: var(--bg); color: #fff; font-style: normal; font-size: .55em; font-weight: 800; text-align: center; }
.duck.pick { animation: bob .6s ease-in-out infinite alternate; }
@keyframes bob { to { transform: translateY(-15%) scale(1.1); } }
.nest { display: flex; flex-direction: column; align-items: center; gap: 1.2vh; min-width: 13vw; padding: 1.2em; border-radius: 1em; background: var(--panel); border-top: .3em solid var(--pc); transition: box-shadow .3s; }
.nest.active { box-shadow: 0 0 0 .2em var(--pc); }
.nest strong { font-size: 1.2em; }
.nest .ducks { display: flex; gap: .4em; min-height: 3em; }
.nest .duck { width: 3em; }
.die { width: 3.4em; aspect-ratio: 1; padding: .45em; gap: .15em; display: grid; grid-template: repeat(3, 1fr) / repeat(3, 1fr); background: #fff; border-radius: .6em; animation: roll .5s ease-out; }
.die span { border-radius: 50%; }
.die span.on { background: var(--bg); }
.die-slot { min-height: 3.4em; }
@keyframes roll { from { transform: rotate(-200deg) scale(.4); } to { transform: none; } }

.dots { --d: 22px; grid-template-columns: repeat(var(--n), var(--d) 1fr) var(--d); grid-template-rows: repeat(var(--n), var(--d) 1fr) var(--d); aspect-ratio: 1; }
.tv .dots { --d: 1.4em; height: 62vh; }
.dots .dot { margin: 18%; border-radius: 50%; background: #fff; z-index: 1; }
.dots .hl::before, .dots .vl::before { content: ''; position: absolute; border-radius: 99px; background: rgba(255, 255, 255, .1); transition: background .2s, box-shadow .2s; }
.dots .hl::before { left: -12%; right: -12%; top: 32%; bottom: 32%; }
.dots .vl::before { top: -12%; bottom: -12%; left: 32%; right: 32%; }
.dots button.hl::before, .dots button.vl::before { background: rgba(255, 255, 255, .24); }
.dots .on::before { background: var(--pc); }
.dots .last::before { box-shadow: 0 0 .7em var(--pc); }
.dots .box { display: grid; place-items: center; margin: 6%; border-radius: .2em; color: var(--pc); font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 1.6em; }
.dots .box.p0, .dots .box.p1 { background: var(--ps); animation: pop .3s ease-out; }

.mem { grid-template-columns: repeat(5, 1fr); grid-template-rows: repeat(4, 1fr); gap: .5em; aspect-ratio: 15 / 16; }
.tv .mem { height: 66vh; }
.mc { perspective: 600px; }
.mc .in { position: absolute; inset: 0; transition: transform .45s; transform-style: preserve-3d; }
.mc.up .in { transform: rotateY(180deg); }
.mc .face { position: absolute; inset: 0; display: grid; place-items: center; border-radius: .5em; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
.mc .back { background: repeating-linear-gradient(45deg, #ff5d8f 0 .4em, #c2386a .4em .8em); border: .2em solid #fbf8f2; }
.mc .front { background: #fbf8f2; transform: rotateY(180deg); }
.mc .front svg { width: 60%; height: 60%; }
.mc.done .front { box-shadow: inset 0 0 0 .25em var(--pc); }

.hang { display: grid; grid-template-columns: auto 1fr; align-items: center; gap: 4vw; width: 100%; max-width: 1500px; }
.gallows { height: 50vh; }
.gallows path, .gallows circle { fill: none; stroke: var(--text); stroke-width: 5; stroke-linecap: round; }
.gallows .frame { stroke: var(--muted); }
.gallows .part { opacity: 0; transition: opacity .3s; }
.gallows .part.on { opacity: 1; stroke: var(--bad); }
.hang-side { display: flex; flex-direction: column; gap: 3vh; }
.word { display: flex; flex-wrap: wrap; gap: .3em 1.2em; }
.word .w { display: flex; gap: .3em; }
.word .w span { min-width: 1.2em; text-align: center; font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 2.8em; line-height: 1.2; border-bottom: .12em solid var(--line); }
.word .w span.hit { animation: pop .3s ease-out; }
.word .w span.miss { color: var(--bad); }
.wrong { display: flex; flex-wrap: wrap; gap: .4em; min-height: 2.2em; }
.wrong span { padding: .2em .6em; border-radius: .4em; background: rgba(255, 93, 125, .15); color: var(--bad); font-weight: 800; }
.keys { grid-template-columns: repeat(7, 1fr); gap: 6px; }
.keys .key { padding: 12px 0; border-radius: 10px; background: var(--panel); border: 2px solid var(--line); font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 1.15em; text-align: center; }
.keys .key.good { background: rgba(79, 224, 143, .2); border-color: var(--good); color: var(--good); }
.keys .key.bad { opacity: .3; }

.lobby { display: flex; align-items: center; gap: 5vw; animation: rise .35s ease-out; }
.qr { background: #fff; padding: 1.2em; border-radius: 1.2em; width: min(42vh, 32vw); aspect-ratio: 1; flex-shrink: 0; }
.qr img { width: 100%; height: 100%; display: block; image-rendering: pixelated; }
.qr-wait { color: var(--bg); display: grid; place-items: center; height: 100%; font-weight: 800; }
.lobby h1 { font-size: 3.2em; line-height: 1.05; margin-bottom: .4em; }
.lobby p { font-size: 1.25em; margin-bottom: .8em; max-width: 28em; font-weight: 700; }
.lobby .url { font-family: ui-monospace, monospace; font-size: 1em; color: var(--muted); word-break: break-all; }
.lobby .error { color: var(--bad); }

.menu { width: 100%; max-width: 1500px; display: flex; flex-direction: column; gap: 2.5vh; animation: rise .35s ease-out; }
.menu h1 { font-size: 2.2em; text-align: center; }
.menu-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.4vw; }
.tile { display: flex; flex-direction: column; gap: .3em; padding: 1em 1.2em; border-radius: 1em; background: var(--panel); border: 2px solid var(--line); }
.tile .num { font-family: 'Fredoka', sans-serif; color: var(--primary); font-weight: 700; font-size: .9em; }
.tile h2 { font-size: 1.35em; }
.tile p { color: var(--muted); font-weight: 700; font-size: .85em; }

.end { text-align: center; display: flex; flex-direction: column; gap: 2vh; animation: rise .35s ease-out; }
.end h1 { font-size: 4em; line-height: 1.05; background: linear-gradient(90deg, #ff5d8f, #ffb35c); -webkit-background-clip: text; background-clip: text; color: transparent; }
.end p { font-size: 1.6em; font-weight: 800; }

.pad { min-height: 100vh; min-height: 100dvh; max-width: 560px; margin: 0 auto; padding: 18px 16px calc(18px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 16px; }
.pad.center { justify-content: center; align-items: center; text-align: center; }
.pad .gb { width: 100%; }
.phead { display: flex; justify-content: space-between; align-items: center; }
.brand.small { font-size: 1.3em; }
.me { padding: .35em .9em; border-radius: 999px; background: var(--pc, var(--panel)); color: var(--bg); font-weight: 800; }
.ptitle { font-family: 'Nunito', sans-serif; font-size: .95em; color: var(--muted); text-transform: uppercase; letter-spacing: .1em; font-weight: 800; }
.ptext { font-size: 1.3em; font-weight: 800; line-height: 1.3; white-space: pre-wrap; }
.ptext.good { color: var(--good); }
.ptext.bad { color: var(--bad); }
.ptext.mine { color: var(--pc, var(--primary)); }
.perror { color: var(--bad); font-weight: 800; }
.pbuttons { display: flex; flex-direction: column; gap: 12px; margin-top: auto; }
.pbuttons.row { flex-direction: row; }
.pbuttons.row .btn { flex: 1; align-items: center; }
.btn { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; width: 100%; padding: 18px; border-radius: 16px; background: var(--panel); border: 2px solid var(--line); font-size: 1.15em; font-weight: 600; text-align: left; transition: transform .08s, opacity .2s; }
.btn:active { transform: scale(.97); }
.btn small { font-family: 'Nunito', sans-serif; font-size: .72em; color: var(--muted); font-weight: 700; }
.btn.p0 small, .btn.p1 small { color: rgba(19, 15, 29, .7); }
.btn.primary { background: var(--primary); border-color: transparent; align-items: center; text-align: center; }
.btn.t0, .btn.t1, .btn.t2, .btn.t3 { background: var(--tc); border-color: transparent; }
.btn.p0, .btn.p1 { background: var(--pc); color: var(--bg); border-color: transparent; align-items: center; }
.btn:disabled { opacity: .35; }
.btn.selected { opacity: 1; box-shadow: 0 0 0 3px #fff; }
.bigtap { flex: 1; min-height: 40vh; border-radius: 28px; background: var(--primary); font-size: 2.6em; font-weight: 700; letter-spacing: .03em; box-shadow: 0 10px 0 #a3305a; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
.bigtap.hit { transform: translateY(6px); box-shadow: 0 4px 0 #a3305a; }
.pform { display: flex; gap: 10px; }
.pform input { flex: 1; min-width: 0; padding: 14px; border-radius: 14px; border: 2px solid var(--line); background: var(--panel); color: var(--text); font: inherit; font-size: 1.2em; text-transform: uppercase; outline: none; }
.pform input:focus { border-color: var(--primary); }
.pform .btn { width: auto; flex: none; }
.link { color: var(--muted); text-decoration: underline; padding: 8px; align-self: center; font-size: .95em; font-weight: 700; }
.join-form { display: flex; flex-direction: column; gap: 12px; margin: auto 0; }
.join-form label { font-weight: 800; color: var(--muted); }
.join-form input { font: inherit; font-size: 1.3em; padding: 16px; border-radius: 14px; border: 2px solid var(--line); background: var(--panel); color: var(--text); outline: none; }
.join-form input:focus { border-color: var(--primary); }
.spinner { width: 42px; height: 42px; border-radius: 50%; border: 4px solid var(--line); border-top-color: var(--primary); animation: spin 1s linear infinite; }
.status { font-size: 1.2em; font-weight: 800; max-width: 22em; }
</style>
</head>
<body>
<div id="app"></div>
<script>
'use strict';

const HOST_PREFIX = 'canape-salon-';
const ROOM = (new URLSearchParams(location.search).get('room') || '').toUpperCase();
const app = document.getElementById('app');

const esc = value => String(value).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const shuffle = list => {
  const a = [...list];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
};
const randInt = n => Math.floor(Math.random() * n);
const pick = list => list[randInt(list.length)];
const store = {
  get(key) { try { return localStorage.getItem(key); } catch { return null; } },
  set(key, value) { try { localStorage.setItem(key, value); } catch {} },
};
const withDe = s => (/^[aeiouyàâéèêîôû]/i.test(s) ? 'd’' : 'de ') + s;
const plural = (n, word) => `${n} ${word}${n > 1 ? 's' : ''}`;

function morphNode(from, to) {
  const sameNode = from.nodeType === to.nodeType && from.nodeName === to.nodeName;
  if (!sameNode || (from.nodeType === 1 && from.getAttribute('data-key') !== to.getAttribute('data-key'))) {
    from.replaceWith(to);
    return;
  }
  if (from.nodeType !== 1) {
    if (from.nodeValue !== to.nodeValue) from.nodeValue = to.nodeValue;
    return;
  }
  for (const { name } of [...from.attributes]) if (!to.hasAttribute(name)) from.removeAttribute(name);
  for (const { name, value } of [...to.attributes]) if (from.getAttribute(name) !== value) from.setAttribute(name, value);
  morphChildren(from, to);
}

function morphChildren(from, to) {
  const current = [...from.childNodes];
  const next = [...to.childNodes];
  next.forEach((node, k) => {
    if (k < current.length) morphNode(current[k], node);
    else from.appendChild(node);
  });
  for (let k = next.length; k < current.length; k++) current[k].remove();
}

function render(html) {
  const template = document.createElement('template');
  template.innerHTML = html.replace(/>\s+</g, '><').trim();
  morphChildren(app, template.content);
}

class Game {
  static board = false;

  constructor(room) {
    this.room = room;
    this.first = room.starter;
    this.timers = new Set();
    this.over = false;
    this.message = '';
    this.said = 0;
  }

  later(fn, ms) {
    const id = setTimeout(() => {
      this.timers.delete(id);
      fn();
    }, ms);
    this.timers.add(id);
  }

  clearTimers() {
    this.timers.forEach(clearTimeout);
    this.timers.clear();
  }

  name(i) {
    return this.room.players[i]?.name ?? `Joueur ${i + 1}`;
  }

  update() {
    this.room.update();
  }

  say(text) {
    this.message = text;
    this.said++;
  }

  finish(result) {
    this.clearTimers();
    this.over = true;
    this.result = result;
    this.room.record(result);
    this.update();
  }

  winnerByScore(scores) {
    if (scores[0] === scores[1]) return null;
    return scores[0] > scores[1] ? 0 : 1;
  }

  scoreLine(scores) {
    return `${this.name(0)} ${scores[0]} – ${scores[1]} ${this.name(1)}`;
  }

  scoreboard(scores) {
    return `<div class="scoreboard">${[0, 1].map(i => `<div class="score p${i}"><span>${esc(this.name(i))}</span><strong>${scores[i]}</strong></div>`).join('')}</div>`;
  }

  playerTag(i) {
    return `<em class="tag p${i}">${esc(this.name(i))}</em>`;
  }

  turnBadge() {
    return `<div class="turn p${this.turn}"><span class="pulse"></span>Au tour de <b>${esc(this.name(this.turn))}</b></div>`;
  }

  noteHtml() {
    return this.message ? `<div class="note" data-key="note${this.said}">${esc(this.message)}</div>` : '';
  }

  head(content) {
    const body = this.over
      ? `<div class="endbar"><b>${esc(this.result.title)}</b><span>Rejouer ou revenir au menu depuis un téléphone</span></div>`
      : content;
    return `<div class="board-head">${body}</div>`;
  }

  turnText(i, mine) {
    return i === this.turn ? mine : `Au tour de ${this.name(this.turn)}…`;
  }
}

class ConnectFour extends Game {
  static id = 'c4';
  static title = 'Puissance 4';
  static tagline = 'Alignez quatre jetons avant l’autre. Touche une colonne pour jouer.';
  static board = true;

  start() {
    this.grid = Array.from({ length: 6 }, () => Array(7).fill(null));
    this.turn = this.first;
    this.winLine = [];
    this.moves = 0;
    this.update();
  }

  dropRow(col) {
    for (let r = 5; r >= 0; r--) if (this.grid[r][col] === null) return r;
    return -1;
  }

  findLine(r, c, p) {
    for (const [dr, dc] of [[0, 1], [1, 0], [1, 1], [1, -1]]) {
      const line = [[r, c]];
      for (const s of [1, -1]) {
        let rr = r + dr * s;
        let cc = c + dc * s;
        while (rr >= 0 && rr < 6 && cc >= 0 && cc < 7 && this.grid[rr][cc] === p) {
          line.push([rr, cc]);
          rr += dr * s;
          cc += dc * s;
        }
      }
      if (line.length >= 4) return line;
    }
    return null;
  }

  act(i, id) {
    if (this.over || i !== this.turn || !/^c[0-6]$/.test(id)) return;
    const col = Number(id[1]);
    const row = this.dropRow(col);
    if (row === -1) return;
    this.grid[row][col] = i;
    this.moves++;
    const line = this.findLine(row, col, i);
    if (line) {
      this.winLine = line;
      return this.finish({ winner: i, title: `${this.name(i)} aligne quatre jetons !`, detail: 'Puissance 4' });
    }
    if (this.moves === 42) return this.finish({ winner: null, title: 'Grille pleine, match nul', detail: 'Puissance 4' });
    this.turn = 1 - i;
    this.update();
  }

  cells(interactive) {
    const win = new Set(this.winLine.map(([r, c]) => `${r}:${c}`));
    const out = [];
    for (let r = 0; r < 6; r++) {
      for (let c = 0; c < 7; c++) {
        const v = this.grid[r][c];
        const cls = ['cell', v === null ? '' : `p${v}`, win.has(`${r}:${c}`) ? 'win' : ''].filter(Boolean).join(' ');
        out.push({ cls, id: interactive && this.dropRow(c) !== -1 ? `c${c}` : undefined });
      }
    }
    return out;
  }

  tv() {
    return `
      <div class="stage board" data-key="c4">
        ${this.head(this.turnBadge())}
        <div class="gb c4">${this.cells(false).map(c => `<div class="${c.cls}"></div>`).join('')}</div>
      </div>`;
  }

  view(i) {
    const mine = i === this.turn;
    return {
      title: 'Puissance 4',
      text: this.turnText(i, 'À toi ! Touche une colonne.'),
      tone: mine ? 'mine' : undefined,
      grid: { cls: 'c4', cells: this.cells(mine) },
    };
  }
}

const SEA = 8;
const FLEET = [4, 3, 3, 2];

function randomFleet() {
  for (;;) {
    const taken = new Set();
    const fleet = [];
    for (const size of FLEET) {
      for (let attempt = 0; attempt < 200; attempt++) {
        const horizontal = Math.random() < .5;
        const r = randInt(horizontal ? SEA : SEA - size + 1);
        const c = randInt(horizontal ? SEA - size + 1 : SEA);
        const cells = Array.from({ length: size }, (_, k) => (horizontal ? r * SEA + c + k : (r + k) * SEA + c));
        if (cells.some(x => taken.has(x))) continue;
        cells.forEach(x => taken.add(x));
        fleet.push({ cells });
        break;
      }
    }
    if (fleet.length === FLEET.length) return fleet;
  }
}

class Battleship extends Game {
  static id = 'sea';
  static title = 'Touché-coulé';
  static tagline = 'Placez votre flotte en secret, puis bombardez celle de l’autre case par case.';
  static board = true;

  start() {
    this.fleets = [randomFleet(), randomFleet()];
    this.ready = [false, false];
    this.shots = [Array(SEA * SEA).fill(null), Array(SEA * SEA).fill(null)];
    this.phase = 'place';
    this.turn = this.first;
    this.last = null;
    this.update();
  }

  shipAt(owner, idx) {
    return this.fleets[owner].find(s => s.cells.includes(idx));
  }

  isSunk(owner, ship) {
    return ship.cells.every(c => this.shots[owner][c] === 'hit');
  }

  afloat(owner) {
    return this.fleets[owner].filter(s => !this.isSunk(owner, s)).length;
  }

  act(i, id) {
    if (this.over) return;
    if (this.phase === 'place') {
      if (this.ready[i]) return;
      if (id === 'shuffle') {
        this.fleets[i] = randomFleet();
      } else if (id === 'ready') {
        this.ready[i] = true;
        if (this.ready.every(Boolean)) this.phase = 'fire';
      } else {
        return;
      }
      return this.update();
    }
    const match = /^s(\d+)$/.exec(id);
    if (i !== this.turn || !match) return;
    const idx = Number(match[1]);
    const target = 1 - i;
    if (idx >= SEA * SEA || this.shots[target][idx]) return;
    const ship = this.shipAt(target, idx);
    this.shots[target][idx] = ship ? 'hit' : 'miss';
    this.last = { target, idx };
    if (!ship) {
      this.say('À l’eau !');
    } else if (this.isSunk(target, ship)) {
      if (this.afloat(target) === 0) {
        return this.finish({ winner: i, title: `${this.name(i)} a coulé toute la flotte de ${this.name(target)} !`, detail: 'Touché-coulé' });
      }
      this.say(`Coulé ! ${this.name(target)} perd un navire de ${ship.cells.length} cases.`);
    } else {
      this.say('Touché !');
    }
    this.turn = target;
    this.update();
  }

  seaCells(owner, showShips, interactive = false) {
    return Array.from({ length: SEA * SEA }, (_, idx) => {
      const shot = this.shots[owner][idx];
      const ship = this.shipAt(owner, idx);
      const cls = [
        'cell',
        showShips && ship ? 'ship' : '',
        shot || '',
        ship && this.isSunk(owner, ship) ? 'sunk' : '',
        this.last?.target === owner && this.last.idx === idx ? 'last' : '',
      ].filter(Boolean).join(' ');
      return { cls, id: interactive && !shot ? `s${idx}` : undefined };
    });
  }

  tv() {
    const fleets = [0, 1].map(owner => {
      const status = this.phase === 'place'
        ? (this.ready[owner] ? 'prête' : 'en préparation…')
        : `${plural(this.afloat(owner), 'navire')} à flot`;
      const targeted = this.phase === 'fire' && !this.over && this.turn !== owner;
      return `
        <div class="fleet p${owner}${targeted ? ' target' : ''}">
          <div class="fleet-head"><span>Flotte de ${esc(this.name(owner))}</span><em>${esc(status)}</em></div>
          <div class="gb sea">${this.seaCells(owner, this.over).map(c => `<div class="${c.cls}"></div>`).join('')}</div>
        </div>`;
    }).join('');
    const status = this.phase === 'place'
      ? '<div class="note">Chacun place sa flotte sur son téléphone…</div>'
      : this.turnBadge() + this.noteHtml();
    return `
      <div class="stage board" data-key="sea">
        ${this.head(status)}
        <div class="board-row">${fleets}</div>
      </div>`;
  }

  view(i) {
    const other = this.name(1 - i);
    if (this.phase === 'place') {
      if (this.ready[i]) {
        return { title: 'Ta flotte', text: `Prêt ! On attend ${other}…`, grid: { cls: 'sea', cells: this.seaCells(i, true) } };
      }
      return {
        title: 'Ta flotte',
        text: 'Voici ta flotte secrète. Mélange jusqu’à ce qu’elle te plaise.',
        grid: { cls: 'sea', cells: this.seaCells(i, true) },
        buttons: [{ id: 'shuffle', label: 'Mélanger' }, { id: 'ready', label: 'Je suis prêt', tone: 'primary' }],
        layout: 'row',
      };
    }
    const prefix = this.message ? `${this.message} ` : '';
    if (i === this.turn) {
      return {
        title: `Flotte de ${other}`,
        text: `${prefix}À toi de tirer !`,
        tone: 'mine',
        grid: { cls: 'sea', cells: this.seaCells(1 - i, false, true) },
      };
    }
    return { title: 'Ta flotte', text: `${prefix}${other} vise ta flotte…`, grid: { cls: 'sea', cells: this.seaCells(i, true) } };
  }
}

function ringCoord(k) {
  if (k < 8) return [0, k];
  if (k < 16) return [k - 8, 8];

class Ducks extends Game {
  static id = 'ducks';
  static title = 'Petits canards';
  static tagline = 'Les petits chevaux version mare. Un 6 pour sortir, et renvoyez les canards de l’autre au nid.';
  static board = true;

  start() {
    this.ducks = [Array(DUCKS).fill(-1), Array(DUCKS).fill(-1)];
    this.turn = this.first;
    this.phase = 'roll';
    this.die = null;
    this.roller = null;
    this.rolls = 0;
    this.tries = 0;
    this.legal = [];
    this.say(`${this.name(this.turn)} commence. Il faut un 6 pour sortir un canard.`);
    this.update();
  }

  coordOf(player, p) {
    if (p < RING) return ringCoord((START[player] + p) % RING);
    if (p < FINISH) return LANES[player][p - RING];
    return [4, 4];
  }

  canMove(p) {
    if (p === -1) return this.die === 6;
    return p !== FINISH && p + this.die <= FINISH;
  }

  act(i, id) {
    if (this.over || i !== this.turn) return;
    if (this.phase === 'roll' && id === 'roll') return this.roll();
    const match = /^d(\d)$/.exec(id);
    if (this.phase === 'move' && match && this.legal.includes(Number(match[1]))) this.move(Number(match[1]));
  }

  roll() {
    this.die = 1 + randInt(6);
    this.roller = this.turn;
    this.rolls++;
    this.legal = this.ducks[this.turn].map((p, k) => (this.canMove(p) ? k : -1)).filter(k => k !== -1);
    if (!this.legal.length) {
      const stuck = this.ducks[this.turn].every(p => p === -1 || p === FINISH);
      if (stuck && ++this.tries < 3) {
        this.say(`${this.die}… Il faut un 6. Encore ${plural(3 - this.tries, 'essai')}.`);
        return this.update();
      }
      this.say(`${this.die} : aucun canard ne peut bouger.`);
      this.passTurn();
      return this.update();
    }
    if (this.legal.length === 1) return this.move(this.legal[0]);
    this.phase = 'move';
    this.say(`${this.die} ! ${this.name(this.turn)} choisit un canard.`);
    this.update();
  }

  move(k) {
    const me = this.turn;
    const other = 1 - me;
    const from = this.ducks[me][k];
    const to = from === -1 ? 0 : from + this.die;
    this.ducks[me][k] = to;
    if (from === -1) this.say(`${this.name(me)} sort le canard ${k + 1} du nid !`);
    else if (to === FINISH) this.say(`Le canard ${k + 1} de ${this.name(me)} arrive à la mare !`);
    else this.say(`${this.name(me)} avance le canard ${k + 1} de ${this.die}.`);
    if (to < RING) {
      const cell = (START[me] + to) % RING;
      this.ducks[other].forEach((p, j) => {
        if (p >= 0 && p < RING && (START[other] + p) % RING === cell) {
          this.ducks[other][j] = -1;
          this.say(`Coin coin ! ${this.name(me)} renvoie un canard de ${this.name(other)} au nid !`);
        }
      });
    }
    if (this.ducks[me].every(p => p === FINISH)) {
      return this.finish({ winner: me, title: `Tous les canards de ${this.name(me)} sont à la mare !`, detail: 'Petits canards' });
    }
    if (this.die === 6) {
      this.say(`${this.message} Un 6, on rejoue !`);
      this.phase = 'roll';
      this.tries = 0;
      this.legal = [];
    } else {
      this.passTurn();
    }
    this.update();
  }

  passTurn() {
    this.turn = 1 - this.turn;
    this.phase = 'roll';
    this.tries = 0;
    this.legal = [];
  }

  picked(player, k) {
    return this.phase === 'move' && player === this.turn && this.legal.includes(k);
  }

  pondHtml() {
    const cells = new Map();
    const put = (r, c, cls) => cells.set(`${r}:${c}`, { r, c, cls, ducks: [] });
    for (let k = 0; k < RING; k++) {
      const [r, c] = ringCoord(k);
      const owner = START.indexOf(k);
      put(r, c, owner === -1 ? 'sq' : `sq start p${owner}`);
    }
    LANES.forEach((lane, player) => lane.forEach(([r, c]) => put(r, c, `sq lane p${player}`)));
    put(4, 4, 'sq mare');
    this.ducks.forEach((list, player) => list.forEach((p, k) => {
      if (p < 0) return;
      const [r, c] = this.coordOf(player, p);
      cells.get(`${r}:${c}`).ducks.push([player, k]);
    }));
    return [...cells.values()].map(cell => `
      <div class="${cell.cls}${cell.ducks.length > 1 ? ' crowd' : ''}" style="grid-area:${cell.r + 1}/${cell.c + 1}">
        ${cell.ducks.map(([player, k]) => duckHtml(player, k, this.picked(player, k))).join('')}
      </div>`).join('');
  }

  nestHtml(player) {
    const home = this.ducks[player].map((p, k) => (p === -1 ? duckHtml(player, k, this.picked(player, k)) : '')).join('');
    const done = this.ducks[player].filter(p => p === FINISH).length;
    const active = !this.over && this.turn === player;
    return `
      <div class="nest p${player}${active ? ' active' : ''}">
        <strong>${esc(this.name(player))}</strong>
        <div class="ducks">${home}</div>
        <span class="muted">À la mare : ${done}/${DUCKS}</span>
        <div class="die-slot">${this.die !== null && this.roller === player ? dieHtml(this.die, this.rolls) : ''}</div>
      </div>`;
  }

  tv() {
    return `
      <div class="stage board" data-key="ducks">
        ${this.head(this.turnBadge() + this.noteHtml())}
        <div class="board-row">
          ${this.nestHtml(0)}
          <div class="gb pond">${this.pondHtml()}</div>
          ${this.nestHtml(1)}
        </div>
      </div>`;
  }

  view(i) {
    const title = 'Petits canards';
    if (i !== this.turn) return { title, text: `${this.message} Au tour de ${this.name(this.turn)}…` };
    if (this.phase === 'roll') {
      return { title, text: this.roller === i ? this.message : 'À toi de jouer !', tone: 'mine', big: { id: 'roll', label: 'Lancer le dé' } };
    }
    return {
      title,
      text: `Tu as fait ${this.die}. Quel canard bouge ?`,
      tone: 'mine',
      buttons: this.legal.map(k => {
        const p = this.ducks[i][k];
        const sub = p === -1 ? 'Sortir du nid' : p + this.die === FINISH ? 'Rentrer à la mare' : `Avancer de ${this.die} cases`;
        return { id: `d${k}`, label: `Canard ${k + 1}`, sub, tone: `p${i}` };
      }),
    };
  }
}

class Dots extends Game {
  static id = 'dots';
  static title = 'Pipopipette';
  static tagline = 'Tracez un trait chacun votre tour. Fermez un carré pour le gagner et rejouer.';
  static board = true;

  start() {
    this.n = 4;
    this.lines = new Map();
    this.boxes = Array(this.n * this.n).fill(null);
    this.scores = [0, 0];
    this.turn = this.first;
    this.last = null;
    this.update();
  }

  isClosed(r, c) {
    return [`h:${r}:${c}`, `h:${r + 1}:${c}`, `v:${r}:${c}`, `v:${r}:${c + 1}`].every(k => this.lines.has(k));
  }

  act(i, id) {
    if (this.over || i !== this.turn) return;
    const match = /^([hv]):(\d+):(\d+)$/.exec(id);
    if (!match || this.lines.has(id)) return;
    const [, dir] = match;
    const r = Number(match[2]);
    const c = Number(match[3]);
    const n = this.n;
    if (dir === 'h' ? r > n || c >= n : r >= n || c > n) return;
    this.lines.set(id, i);
    this.last = id;
    const around = dir === 'h' ? [[r - 1, c], [r, c]] : [[r, c - 1], [r, c]];
    let closed = 0;
    for (const [br, bc] of around) {
      if (br < 0 || bc < 0 || br >= n || bc >= n) continue;
      if (this.boxes[br * n + bc] === null && this.isClosed(br, bc)) {
        this.boxes[br * n + bc] = i;
        this.scores[i]++;
        closed++;
      }
    }
    if (this.lines.size === 2 * n * (n + 1)) {
      const winner = this.winnerByScore(this.scores);
      return this.finish({
        winner,
        title: winner === null ? 'Égalité parfaite !' : `${this.name(winner)} remporte le plus de carrés !`,
        detail: this.scoreLine(this.scores),
      });
    }
    if (!closed) this.turn = 1 - i;
    this.update();
  }

  cells(interactive) {
    const n = this.n;
    const out = [];
    for (let gr = 0; gr <= 2 * n; gr++) {
      for (let gc = 0; gc <= 2 * n; gc++) {
        const evenRow = gr % 2 === 0;
        const evenCol = gc % 2 === 0;
        if (evenRow && evenCol) {
          out.push({ cls: 'dot' });
        } else if (!evenRow && !evenCol) {
          const owner = this.boxes[((gr - 1) / 2) * n + (gc - 1) / 2];
          out.push({ cls: owner === null ? 'box' : `box p${owner}`, label: owner === null ? '' : this.name(owner)[0].toUpperCase() });
        } else {
          const key = evenRow ? `h:${gr / 2}:${(gc - 1) / 2}` : `v:${(gr - 1) / 2}:${gc / 2}`;
          const owner = this.lines.get(key);
          const cls = [evenRow ? 'hl' : 'vl', owner === undefined ? '' : `on p${owner}`, key === this.last ? 'last' : ''].filter(Boolean).join(' ');
          out.push({ cls, id: interactive && owner === undefined ? key : undefined });
        }
      }
    }
    return out;
  }

  tv() {
    const cells = this.cells(false).map(c => `<div class="${c.cls}">${esc(c.label ?? '')}</div>`).join('');
    return `
      <div class="stage board" data-key="dots">
        ${this.head(this.turnBadge())}
        <div class="board-row">
          <div class="gb dots" style="--n:${this.n}">${cells}</div>
          ${this.scoreboard(this.scores).replace('class="scoreboard"', 'class="scoreboard" style="flex-direction:column"')}
        </div>
      </div>`;
  }

  view(i) {
    const mine = i === this.turn;
    return {
      title: `${this.name(0)} ${this.scores[0]} – ${this.scores[1]} ${this.name(1)}`,
      text: this.turnText(i, 'À toi ! Touche un trait.'),
      tone: mine ? 'mine' : undefined,
      grid: { cls: 'dots', style: `--n:${this.n}`, cells: this.cells(mine) },
    };
  }
}

class Memory extends Game {
  static id = 'memory';
  static title = 'Memory';
  static tagline = 'Retournez deux cartes. Une paire rapporte un point et permet de rejouer.';
  static board = true;

  start() {
    const pairs = [...ICONS.keys()];
    this.deck = shuffle([...pairs, ...pairs]);
    this.owner = Array(this.deck.length).fill(null);
    this.open = [];
    this.scores = [0, 0];
    this.turn = this.first;
    this.lock = false;
    this.update();
  }

  act(i, id) {
    if (this.over || i !== this.turn || this.lock) return;
    const match = /^m(\d+)$/.exec(id);
    if (!match) return;
    const k = Number(match[1]);
    if (k >= this.deck.length || this.owner[k] !== null || this.open.includes(k)) return;
    this.open.push(k);
    if (this.open.length < 2) return this.update();
    const [a, b] = this.open;
    if (this.deck[a] === this.deck[b]) {
      this.owner[a] = i;
      this.owner[b] = i;
      this.scores[i]++;
      this.open = [];
      this.say(`Paire pour ${this.name(i)} !`);
      if (this.owner.every(o => o !== null)) {
        const winner = this.winnerByScore(this.scores);
        return this.finish({
          winner,
          title: winner === null ? 'Égalité, mémoires jumelles !' : `${this.name(winner)} a la meilleure mémoire !`,
          detail: this.scoreLine(this.scores),
        });
      }
      return this.update();
    }
    this.lock = true;
    this.say('Raté…');
    this.update();
    this.later(() => {
      this.open = [];
      this.lock = false;
      this.turn = 1 - i;
      this.update();
    }, 1600);
  }

  cards(interactive) {
    return this.deck.map((symbol, k) => {
      const up = this.owner[k] !== null || this.open.includes(k);
      const cls = ['mc', up ? 'up' : '', this.owner[k] !== null ? `done p${this.owner[k]}` : ''].filter(Boolean).join(' ');
      return { cls, html: memoryCardHtml(up ? symbol : null), id: interactive && !up && !this.lock ? `m${k}` : undefined };
    });
  }

  tv() {
    return `
      <div class="stage board" data-key="memory">
        ${this.head(this.turnBadge() + this.noteHtml())}
        <div class="board-row">
          <div class="gb mem">${this.cards(false).map(c => `<div class="${c.cls}">${c.html}</div>`).join('')}</div>
          ${this.scoreboard(this.scores).replace('class="scoreboard"', 'class="scoreboard" style="flex-direction:column"')}
        </div>
      </div>`;
  }

  view(i) {
    const mine = i === this.turn && !this.lock;
    return {
      title: `${this.name(0)} ${this.scores[0]} – ${this.scores[1]} ${this.name(1)}`,
      text: this.lock ? this.message : this.turnText(i, this.open.length ? 'Et la deuxième carte ?' : 'À toi ! Retourne une carte.'),
      tone: mine ? 'mine' : undefined,
      grid: { cls: 'mem', cells: this.cards(mine) },
    };
  }
}

const MAX_WRONG = 7;
const ALPHABET = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';

function normalizeWord(value) {
  const word = String(value ?? '')
    .replace(/œ/gi, 'oe')
    .replace(/æ/gi, 'ae')
    .replace(/’/g, '\'')
    .normalize('NFD')
    .replace(/[̀-ͯ]/g, '')
    .toUpperCase()
    .replace(/\s+/g, ' ')
    .trim();
  const letters = word.replace(/[^A-Z]/g, '').length;
  return /^[A-Z][A-Z' -]*$/.test(word) && letters >= 3 && word.length <= 16 ? word : null;
}

class Hangman extends Game {
  static id = 'pendu';
  static title = 'Le pendu';
  static tagline = 'Chacun son tour, l’un choisit un mot secret sur son téléphone, l’autre devine lettre par lettre.';
  static board = true;

  start() {
    this.round = 0;
    this.rounds = 4;
    this.scores = [0, 0];
    this.newRound();
  }

  newRound() {
    this.setter = (this.first + this.round) % 2;
    this.guesser = 1 - this.setter;
    this.turn = this.setter;
    this.word = null;
    this.guessed = new Set();
    this.wrong = 0;
    this.error = '';
    this.phase = 'set';
    this.update();
  }

  isSolved() {
    return [...this.word].every(ch => !/[A-Z]/.test(ch) || this.guessed.has(ch));
  }

  act(i, id, value) {
    if (this.over) return;
    if (this.phase === 'set' && i === this.setter) {
      const word = id === 'random' ? pick(WORDS) : id === 'word' ? normalizeWord(value) : undefined;
      if (word === undefined) return;
      if (word === null) {
        this.error = 'Uniquement des lettres, entre 3 et 16 caractères.';
        return this.update();
      }
      this.word = word;
      this.error = '';
      this.phase = 'guess';
      this.turn = this.guesser;
      return this.update();
    }
    if (this.phase === 'guess' && i === this.guesser) {
      const match = /^k([A-Z])$/.exec(id);
      if (!match || this.guessed.has(match[1])) return;
      this.guessed.add(match[1]);
      if (!this.word.includes(match[1])) this.wrong++;
      if (this.isSolved()) return this.endRound(this.guesser);
      if (this.wrong >= MAX_WRONG) return this.endRound(this.setter);
      return this.update();
    }
    if (this.phase === 'result' && id === `next:${this.round}`) {
      this.round++;
      if (this.round < this.rounds) return this.newRound();
      const winner = this.winnerByScore(this.scores);
      this.finish({
        winner,
        title: winner === null ? 'Égalité au pendu !' : `${this.name(winner)} gagne au pendu !`,
        detail: this.scoreLine(this.scores),
      });
    }
  }

  endRound(winner) {
    this.roundWinner = winner;
    this.scores[winner]++;
    this.phase = 'result';
    this.update();
  }

  masked() {
    return this.word.split(' ').map(part => [...part].map(ch => (/[A-Z]/.test(ch) && !this.guessed.has(ch) ? '_' : ch)).join(' ')).join('   ');
  }

  wordHtml() {
    const reveal = this.phase === 'result';
    const letter = ch => {
      if (!/[A-Z]/.test(ch)) return `<span>${esc(ch)}</span>`;
      if (this.guessed.has(ch)) return `<span class="hit">${ch}</span>`;
      return reveal ? `<span class="miss">${ch}</span>` : '<span></span>';
    };
    return this.word.split(' ').map(part => `<span class="w">${[...part].map(letter).join('')}</span>`).join('');
  }

  gallowsHtml() {
    const parts = [
      '<circle cx="140" cy="68" r="20"/>',
      '<path d="M140 88V150"/>',
      '<path d="M140 105L112 130"/>',
      '<path d="M140 105L168 130"/>',
      '<path d="M140 150L116 190"/>',
      '<path d="M140 150L164 190"/>',
      '<path d="M131 62l6 6m0-6l-6 6M143 62l6 6m0-6l-6 6"/>',
    ];
    return `
      <svg class="gallows" viewBox="0 0 200 240" aria-hidden="true">
        <path class="frame" d="M20 230H150M50 230V20H140V48"/>
        ${parts.map((p, k) => `<g class="part${k < this.wrong ? ' on' : ''}">${p}</g>`).join('')}
      </svg>`;
  }

  tv() {
    let side;
    if (this.phase === 'set') {
      side = `<div class="question" data-key="set${this.round}">${esc(this.name(this.setter))} choisit un mot secret…</div>`;
    } else {
      const wrong = [...this.guessed].filter(ch => !this.word.includes(ch)).map(ch => `<span>${ch}</span>`).join('');
      const verdict = this.phase === 'result'
        ? `<div class="verdict ${this.roundWinner === this.guesser ? 'good' : 'bad'}">${this.roundWinner === this.guesser ? `${esc(this.name(this.guesser))} a trouvé !` : `${esc(this.name(this.guesser))} est pendu…`}</div>`
        : '';
      side = `
        <div class="word" data-key="word${this.round}">${this.wordHtml()}</div>
        <div class="wrong">${wrong}</div>
        <div class="muted">${plural(MAX_WRONG - this.wrong, 'erreur')} restante${MAX_WRONG - this.wrong > 1 ? 's' : ''}</div>
        ${verdict}`;
    }
    return `
      <div class="stage board" data-key="pendu">
        ${this.head(`<span class="kicker">Manche ${this.round + 1}/${this.rounds}</span>${this.turnBadge()}`)}
        <div class="hang">
          ${this.gallowsHtml()}
          <div class="hang-side">${side}${this.scoreboard(this.scores)}</div>
        </div>
      </div>`;
  }

  view(i) {
    const title = `Pendu · manche ${this.round + 1}/${this.rounds}`;
    if (this.phase === 'set') {
      if (i !== this.setter) return { title, text: `${this.name(this.setter)} choisit un mot secret…` };
      return {
        title,
        text: `Choisis un mot que ${this.name(this.guesser)} devra deviner.`,
        tone: 'mine',
        input: { id: 'word', placeholder: 'Mot secret', maxlength: 16 },
        error: this.error,
        buttons: [{ id: 'random', label: 'Mot au hasard' }],
      };
    }
    if (this.phase === 'guess') {
      if (i === this.setter) {
        return { title, text: `Ton mot : ${this.word}. ${this.name(this.guesser)} en est à ${plural(this.wrong, 'erreur')}.` };
      }
      return {
        title,
        text: `${this.masked()}  ·  ${MAX_WRONG - this.wrong} essais`,
        tone: 'mine',
        grid: {
          cls: 'keys',
          cells: [...ALPHABET].map(ch => {
            const used = this.guessed.has(ch);
            const cls = `key${used ? (this.word.includes(ch) ? ' good' : ' bad') : ''}`;
            return { cls, label: ch, id: used ? undefined : `k${ch}` };
          }),
        },
      };
    }
    const won = this.roundWinner === i;
    return {
      title,
      text: `Le mot était ${this.word}. ${won ? 'Point pour toi !' : 'Point pour l’autre…'}`,
      tone: won ? 'good' : 'bad',
      buttons: [{ id: `next:${this.round}`, label: this.round + 1 < this.rounds ? 'Manche suivante' : 'Voir le résultat', tone: 'primary' }],
    };
  }
}

class Reflex extends Game {
  static id = 'reflex';
  static title = 'Duel de réflexes';
  static tagline = 'Tapez dès que la télé passe au vert. Trop tôt, c’est perdu. Premier à 5.';

  start() {
    this.target = 5;
    this.scores = [0, 0];
    this.round = 0;
    this.newRound();
  }

  newRound() {
    this.clearTimers();
    this.round++;
    this.phase = 'wait';
    this.outcome = null;
    this.update();
    this.later(() => {
      this.phase = 'go';
      this.goAt = performance.now();
      this.update();
    }, 2000 + Math.random() * 4000);
  }

  act(i, id) {
    if (id !== 'tap') return;
    if (this.phase === 'wait') this.resolve(1 - i, { early: i });
    else if (this.phase === 'go') this.resolve(i, { ms: Math.round(performance.now() - this.goAt) });
  }

  resolve(winner, info) {
    this.clearTimers();
    this.phase = 'result';
    this.scores[winner]++;
    this.outcome = { winner, ...info };
    this.update();
    if (this.scores[winner] >= this.target) {
      this.later(() => this.finish({
        winner,
        title: `${this.name(winner)} a les meilleurs réflexes`,
        detail: this.scoreLine(this.scores),
      }), 2500);
    } else {
      this.later(() => this.newRound(), 2500);
    }
  }

  tv() {
    let signal = 'Attendez…';
    let hint = 'Ne touchez à rien';
    if (this.phase === 'go') {
      signal = 'TAPEZ !';
      hint = '';
    } else if (this.phase === 'result') {
      const o = this.outcome;
      signal = `${this.name(o.winner)} gagne la manche`;
      hint = o.early !== undefined ? `${this.name(o.early)} est parti trop tôt` : `en ${o.ms} ms`;
    }
    return `
      <div class="reflex ${this.phase}" data-key="reflex">
        <div class="kicker">Manche ${this.round} · premier à ${this.target}</div>
        <div class="signal">${esc(signal)}</div>
        <div class="hint">${esc(hint)}</div>
        ${this.scoreboard(this.scores)}
      </div>`;
  }

  view(i) {
    const won = this.outcome?.winner === i;
    return {
      title: `Manche ${this.round}`,
      text: this.phase === 'result' ? (won ? 'Manche gagnée !' : 'Manche perdue') : 'Regarde la télé et tape au vert',
      tone: this.phase === 'result' ? (won ? 'good' : 'bad') : undefined,
      big: { id: 'tap', label: 'TAPE' },
    };
  }
}

class Quiz extends Game {
  static id = 'quiz';
  static title = 'Quiz express';
  static tagline = 'Culture générale. Bonne réponse : 1 point. Le plus rapide : 1 point bonus.';

  start() {
    this.rounds = shuffle(QUIZ).slice(0, 10).map(([q, answers]) => ({
      q,
      options: shuffle(answers.map((text, i) => ({ text, correct: i === 0 }))),
    }));
    this.index = -1;
    this.scores = [0, 0];
    this.next();
  }

  next() {
    this.clearTimers();
    this.index++;
    if (this.index >= this.rounds.length) {
      const winner = this.winnerByScore(this.scores);
      return this.finish({
        winner,
        title: winner === null ? 'Égalité parfaite' : `${this.name(winner)} est le cerveau du couple`,
        detail: this.scoreLine(this.scores),
      });
    }
    this.picks = [null, null];
    this.first = null;
    this.gained = [0, 0];
    this.phase = 'ask';
    this.deadline = Date.now() + 20000;
    this.update();
    this.tick();
  }

  remaining() {
    return Math.max(0, Math.ceil((this.deadline - Date.now()) / 1000));
  }

  tick() {
    if (this.phase !== 'ask') return;
    if (this.remaining() <= 0) return this.reveal();
    this.room.renderTv();
    this.later(() => this.tick(), 250);
  }

  act(i, id) {
    if (this.phase !== 'ask' || this.picks[i] !== null || !/^o[0-3]$/.test(id)) return;
    const choice = Number(id[1]);
    this.picks[i] = choice;
    if (this.rounds[this.index].options[choice].correct && this.first === null) this.first = i;
    if (this.picks.every(p => p !== null)) this.reveal();
    else this.update();
  }

  reveal() {
    this.clearTimers();
    this.phase = 'reveal';
    const { options } = this.rounds[this.index];
    for (const i of [0, 1]) {
      const right = this.picks[i] !== null && options[this.picks[i]].correct;
      this.gained[i] = right ? 1 + (this.first === i ? 1 : 0) : 0;
      this.scores[i] += this.gained[i];
    }
    this.update();
    this.later(() => this.next(), 5000);
  }

  tv() {
    const round = this.rounds[this.index];
    const reveal = this.phase === 'reveal';
    const options = round.options.map((option, k) => {
      const cls = reveal ? (option.correct ? ' correct' : ' dim') : '';
      const tags = reveal ? [0, 1].filter(i => this.picks[i] === k).map(i => this.playerTag(i)).join('') : '';
      return `<div class="option t${k}${cls}"><span class="letter">${'ABCD'[k]}</span><span class="otext">${esc(option.text)}</span>${tags}</div>`;
    }).join('');
    const chips = [0, 1].map(i => (reveal
      ? `<span class="chip p${i} done">${esc(this.name(i))} +${this.gained[i]}</span>`
      : `<span class="chip p${i}${this.picks[i] !== null ? ' done' : ''}">${esc(this.name(i))} ${this.picks[i] !== null ? 'a répondu' : 'réfléchit…'}</span>`
    )).join('');
    return `
      <div class="stage" data-key="quiz">
        <div class="topline">
          <span class="kicker">Question ${this.index + 1}/${this.rounds.length}</span>
          <span class="timer">${reveal ? '–' : this.remaining()}</span>
        </div>
        <h2 class="question" data-key="q${this.index}">${esc(round.q)}</h2>
        <div class="options">${options}</div>
        <div class="chips">${chips}</div>
        ${this.scoreboard(this.scores)}
      </div>`;
  }

  view(i) {
    const round = this.rounds[this.index];
    const title = `Question ${this.index + 1}/${this.rounds.length}`;
    if (this.phase === 'ask') {
      return {
        title,
        text: round.q,
        buttons: round.options.map((option, k) => ({
          id: `o${k}`,
          label: `${'ABCD'[k]}. ${option.text}`,
          tone: `t${k}`,
          selected: this.picks[i] === k,
          disabled: this.picks[i] !== null && this.picks[i] !== k,
        })),
      };
    }
    const gained = this.gained[i];
    return {
      title,
      text: gained === 2 ? 'Bonne réponse, et le plus rapide ! +2' : gained === 1 ? 'Bonne réponse ! +1' : 'Raté…',
      tone: gained ? 'good' : 'bad',
    };
  }
}

class WhoOfUs extends Game {
  static id = 'who';
  static title = 'Qui de nous deux ?';
  static tagline = 'Votez en secret pour l’un de vous deux, puis découvrez si vous êtes d’accord.';

  start() {
    this.prompts = shuffle(WHO).slice(0, 10);
    this.index = -1;
    this.matches = 0;
    this.next();
  }

  next() {
    this.index++;
    if (this.index >= this.prompts.length) {
      const n = this.matches;
      const verdict = n >= 9 ? 'Télépathie totale.' : n >= 6 ? 'Bien synchronisés.' : n >= 3 ? 'Quelques débats en perspective.' : 'Vous êtes sûrs de vous connaître ?';
      return this.finish({ winner: null, title: `${n}/${this.prompts.length} réponses identiques`, detail: verdict });
    }
    this.votes = [null, null];
    this.phase = 'vote';
    this.update();
  }

  act(i, id) {
    if (this.phase === 'vote' && this.votes[i] === null && (id === 'v0' || id === 'v1')) {
      this.votes[i] = Number(id[1]);
      if (this.votes.every(v => v !== null)) {
        this.phase = 'reveal';
        if (this.votes[0] === this.votes[1]) this.matches++;
      }
      this.update();
    } else if (this.phase === 'reveal' && id === `next:${this.index}`) {
      this.next();
    }
  }

  tv() {
    let body;
    if (this.phase === 'vote') {
      body = `<div class="chips">${[0, 1].map(i => `<span class="chip p${i}${this.votes[i] !== null ? ' done' : ''}">${esc(this.name(i))} ${this.votes[i] !== null ? 'a voté' : 'réfléchit…'}</span>`).join('')}</div>`;
    } else {
      const same = this.votes[0] === this.votes[1];
      body = `
        <div class="verdict ${same ? 'good' : 'bad'}">${same ? `D’accord tous les deux : ${esc(this.name(this.votes[0]))} !` : 'Désaccord total, à vous de débattre.'}</div>
        <div class="votes">${[0, 1].map(i => `<div class="vote p${i}"><span>${esc(this.name(i))} a voté</span><strong>${esc(this.name(this.votes[i]))}</strong></div>`).join('')}</div>`;
    }
    return `
      <div class="stage" data-key="who">
        <div class="topline">
          <span class="kicker">Question ${this.index + 1}/${this.prompts.length}</span>
          <span class="kicker">${this.matches} en commun</span>
        </div>
        <p class="lead">Qui de nous deux est le plus susceptible…</p>
        <h2 class="question" data-key="w${this.index}">${esc(withDe(this.prompts[this.index]))} ?</h2>
        ${body}
      </div>`;
  }

  view(i) {
    const title = `Question ${this.index + 1}/${this.prompts.length}`;
    if (this.phase === 'vote') {
      if (this.votes[i] !== null) return { title, text: 'Vote enregistré. On attend l’autre…' };
      return {
        title,
        text: `Qui de nous deux est le plus susceptible ${withDe(this.prompts[this.index])} ?`,
        buttons: [0, 1].map(k => ({ id: `v${k}`, label: k === i ? `Moi (${this.name(k)})` : this.name(k), tone: `p${k}` })),
      };
    }
    const same = this.votes[0] === this.votes[1];
    return {
      title,
      text: same ? 'Même réponse !' : 'Pas d’accord… défendez-vous !',
      tone: same ? 'good' : 'bad',
      buttons: [{ id: `next:${this.index}`, label: 'Question suivante', tone: 'primary' }],
    };
  }
}

const GAMES = [ConnectFour, Battleship, Ducks, Dots, Memory, Hangman, Reflex, Quiz, WhoOfUs];

const host = { peer: null, code: '', error: '', qr: '' };

const room = {
  players: [null, null],
  game: null,
  sent: [null, null],
  starter: 1,

  ready() {
    return Boolean(this.players[0] && this.players[1]);
  },

  renderTv() {
    renderTv();
  },

  update() {
    renderTv();
    this.push(0);
    this.push(1);
  },

  push(i) {
    const player = this.players[i];
    if (!player?.conn?.open) return;
    const view = this.viewFor(i);
    const json = JSON.stringify(view);
    if (json === this.sent[i]) return;
    this.sent[i] = json;
    player.conn.send({ t: 'view', view, slot: i });
  },

  viewFor(i) {
    if (!this.ready()) {
      return { title: `Salut ${this.players[i].name}`, text: 'En attente du deuxième joueur. Scanne le QR code de la télé avec l’autre téléphone.' };
    }
    if (!this.game) {
      return { title: 'Choisissez un jeu', buttons: GAMES.map(G => ({ id: `g:${G.id}`, label: G.title, sub: G.tagline })) };
    }
    if (this.game.over) {
      const r = this.game.result;
      const won = r.winner === i;
      const lost = r.winner === 1 - i;
      return {
        title: won ? 'Victoire !' : lost ? 'Défaite…' : 'Partie terminée',
        text: r.title,
        tone: won ? 'good' : lost ? 'bad' : undefined,
        buttons: [{ id: 'again', label: 'Rejouer', tone: 'primary' }, { id: 'menu', label: 'Retour au menu' }],
      };
    }
    return { ...this.game.view(i), quit: true };
  },

  act(i, id, value) {
    if (id === 'quit' || (id === 'menu' && this.game?.over)) {
      this.stop();
      return this.update();
    }
    if (!this.game) {
      const G = GAMES.find(g => `g:${g.id}` === id);
      if (G && this.ready()) this.launch(G);
      return;
    }
    if (this.game.over) {
      if (id === 'again') this.launch(this.game.constructor);
      return;
    }
    this.game.act(i, id, value);
  },

  launch(G) {
    this.stop();
    this.starter = 1 - this.starter;
    this.game = new G(this);
    this.game.start();
  },

  stop() {
    if (!this.game) return;
    this.game.clearTimers();
    this.game = null;
  },

  record(result) {
    if (result.winner !== null && this.players[result.winner]) this.players[result.winner].trophies++;
  },
};

const CODE_CHARS = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
const newCode = () => Array.from({ length: 4 }, () => pick(CODE_CHARS)).join('');
const joinUrl = () => `${location.origin}${location.pathname}?room=${host.code}`;

function renderTv() {
  const chips = [0, 1].map(i => {
    const p = room.players[i];
    if (!p) return `<div class="pchip empty">Joueur ${i + 1}</div>`;
    return `<div class="pchip p${i}${p.conn?.open ? '' : ' off'}"><span class="dot"></span>${esc(p.name)}<b title="Victoires">${p.trophies}</b></div>`;
  }).join('');

  let main;
  const game = room.game;
  if (!room.ready()) main = lobbyHtml();
  else if (!game) main = menuHtml();
  else if (game.over && !game.constructor.board) main = endHtml(game);
  else main = game.tv();

  render(`
    <div class="tv">
      <header class="bar">
        <div class="brand">Canapé<span>.</span></div>
        <div class="players">${chips}</div>
        <div class="code">Salle <b>${esc(host.code)}</b></div>
      </header>
      <main class="tv-main">${main}</main>
    </div>`);
}

function lobbyHtml() {
  const joined = room.players.filter(Boolean).map(p => esc(p.name));
  return `
    <div class="lobby" data-key="lobby">
      <div class="qr">${host.qr ? `<img src="${host.qr}" alt="QR code pour rejoindre">` : '<div class="qr-wait">Connexion…</div>'}</div>
      <div>
        <h1>Scannez pour jouer</h1>
        <p>Chaque joueur scanne ce code avec son téléphone, entre son prénom, et c’est parti.</p>
        <p class="url">${esc(joinUrl())}</p>
        ${host.error ? `<p class="error">${esc(host.error)}</p>` : ''}
        <p class="muted">${joined.length ? `Déjà là : ${joined.join(', ')}` : 'Personne pour l’instant.'}</p>
      </div>
    </div>`;
}

function menuHtml() {
  const tiles = GAMES.map((G, k) => `
    <div class="tile">
      <span class="num">${String(k + 1).padStart(2, '0')}</span>
      <h2>${esc(G.title)}</h2>
      <p>${esc(G.tagline)}</p>
    </div>`).join('');
  return `
    <div class="menu" data-key="menu">
      <h1>Choisissez un jeu sur votre téléphone</h1>
      <div class="menu-grid">${tiles}</div>
    </div>`;
}

function endHtml(game) {
  const r = game.result;
  return `
    <div class="end" data-key="end">
      <span class="kicker">${esc(game.constructor.title)}</span>
      <h1>${esc(r.title)}</h1>
      <p>${esc(r.detail)}</p>
      <p class="muted">Rejouer ou revenir au menu depuis un téléphone.</p>
    </div>`;
}

function makeQr() {
  const box = document.createElement('div');
  new QRCode(box, { text: joinUrl(), width: 512, height: 512, colorDark: '#130f1d', colorLight: '#ffffff', correctLevel: QRCode.CorrectLevel.M });
  const canvas = box.querySelector('canvas');
  host.qr = canvas ? canvas.toDataURL() : (box.querySelector('img')?.src || '');
}

function startHost() {
  host.code = store.get('canape-room') || newCode();
  openHostPeer();
  renderTv();
}

function openHostPeer() {
  const peer = new Peer(HOST_PREFIX + host.code);
  host.peer = peer;

  peer.on('open', () => {
    if (host.peer !== peer) return;
    host.error = '';
    store.set('canape-room', host.code);
    makeQr();
    renderTv();
  });

  peer.on('connection', conn => {
    conn.on('data', msg => onHostMessage(conn, msg));
    conn.on('close', () => onHostClose(conn));
    conn.on('error', () => onHostClose(conn));
  });

  peer.on('disconnected', () => {
    if (host.peer === peer && !peer.destroyed) peer.reconnect();
  });

  peer.on('error', err => {
    if (host.peer !== peer) return;
    if (err.type === 'unavailable-id') {
      peer.destroy();
      host.code = newCode();
      host.qr = '';
      openHostPeer();
      renderTv();
      return;
    }
    if (err.type === 'peer-unavailable') return;
    host.error = 'Problème de connexion au serveur. Vérifie le Wi-Fi de la télé, nouvelle tentative en cours.';
    renderTv();
    setTimeout(() => {
      if (host.peer === peer && !peer.open) {
        peer.destroy();
        openHostPeer();
      }
    }, 3000);
  });
}

function onHostMessage(conn, msg) {
  if (!msg || typeof msg !== 'object') return;
  if (msg.t === 'join') return join(conn, msg.name);
  const i = room.players.findIndex(p => p?.conn === conn);
  if (i !== -1 && msg.t === 'act' && typeof msg.id === 'string') {
    room.act(i, msg.id, typeof msg.value === 'string' ? msg.value : undefined);
  }
}

function join(conn, rawName) {
  const name = String(rawName ?? '').trim().slice(0, 16) || 'Joueur';
  const key = name.toLowerCase();
  let i = room.players.findIndex(p => p && p.name.toLowerCase() === key);
  if (i === -1) i = room.players.findIndex(p => !p);
  if (i === -1) i = room.players.findIndex(p => !p.conn?.open);
  if (i === -1) {
    conn.send({ t: 'full' });
    return;
  }
  const previous = room.players[i];
  const sameName = previous && previous.name.toLowerCase() === key;
  room.players[i] = { name, conn, trophies: sameName ? previous.trophies : 0 };
  if (previous?.conn && previous.conn !== conn) previous.conn.close();
  room.sent[i] = null;
  room.update();
}

function onHostClose(conn) {
  const i = room.players.findIndex(p => p?.conn === conn);
  if (i === -1) return;
  room.players[i].conn = null;
  room.sent[i] = null;
  renderTv();
}

const player = { peer: null, conn: null, name: '', slot: null, view: null, tone: null, retry: null, dialTimeout: null, full: false };

function startPlayer() {
  const saved = store.get('canape-name') || '';
  render(`
    <div class="pad" data-key="join">
      <div class="brand">Canapé<span>.</span></div>
      <form id="join-form" class="join-form">
        <label for="name">Ton prénom</label>
        <input id="name" maxlength="16" autocomplete="given-name" value="${esc(saved)}" required>
        <button class="btn primary" type="submit">Rejoindre la salle ${esc(ROOM)}</button>
      </form>
    </div>`);

  app.addEventListener('submit', event => {
    event.preventDefault();
    const form = event.target;
    if (form.id === 'join-form') {
      player.name = form.elements.name.value.trim().slice(0, 16);
      if (!player.name) return;
      store.set('canape-name', player.name);
      renderStatus('Connexion à la télé…');
      connect();
      return;
    }
    if (form.dataset.act) {
      const input = form.elements.value;
      send(form.dataset.act, input.value);
      input.value = '';
      input.blur();
    }
  });

  app.addEventListener('click', event => {
    const button = event.target.closest('[data-id]');
    if (!button || button.disabled || button.dataset.fast) return;
    if (button.dataset.id === 'quit' && !confirm('Quitter la partie en cours ?')) return;
    send(button.dataset.id);
  });

  app.addEventListener('pointerdown', event => {
    const button = event.target.closest('[data-fast]');
    if (!button) return;
    event.preventDefault();
    button.classList.add('hit');
    setTimeout(() => button.classList.remove('hit'), 120);
    send(button.dataset.id);
  });

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && player.name && !player.full && !player.conn?.open) connect();
  });
}

function connect() {
  clearTimeout(player.retry);
  if (!player.peer || player.peer.destroyed) {
    const peer = new Peer();
    player.peer = peer;
    peer.on('open', () => {
      if (player.peer === peer) dial();
    });
    peer.on('disconnected', () => {
      if (player.peer === peer && !peer.destroyed) peer.reconnect();
    });
    peer.on('error', err => {
      if (player.peer !== peer) return;
      if (err.type === 'peer-unavailable') {
        renderStatus('Télé introuvable. Vérifie que la page est bien ouverte sur la télé.', true);
      } else {
        peer.destroy();
        player.peer = null;
        renderStatus('Connexion perdue, nouvelle tentative…');
      }
      scheduleRetry();
    });
  } else if (player.peer.open) {
    dial();
  }
}

function dial() {
  const old = player.conn;
  player.conn = null;
  old?.close();
  clearTimeout(player.dialTimeout);

  const conn = player.peer.connect(HOST_PREFIX + ROOM, { reliable: true });
  player.conn = conn;

  conn.on('open', () => {
    if (player.conn !== conn) return;
    clearTimeout(player.dialTimeout);
    conn.send({ t: 'join', name: player.name });
  });
  conn.on('data', msg => {
    if (player.conn === conn) onPlayerMessage(msg);
  });
  conn.on('close', () => {
    if (player.conn !== conn || player.full) return;
    player.conn = null;
    renderStatus('Connexion perdue, reconnexion…');
    scheduleRetry();
  });

  player.dialTimeout = setTimeout(() => {
    if (player.conn !== conn || conn.open) return;
    renderStatus('Impossible de joindre la télé. Êtes-vous bien sur le même Wi-Fi ?', true);
    scheduleRetry();
  }, 10000);
}

function scheduleRetry() {
  if (player.full) return;
  clearTimeout(player.retry);
  player.retry = setTimeout(connect, 3000);
}

function send(id, value) {
  if (id === '__retry') {
    player.full = false;
    renderStatus('Connexion à la télé…');
    return connect();
  }
  if (!player.conn?.open) return;
  player.conn.send(value === undefined ? { t: 'act', id } : { t: 'act', id, value: String(value).slice(0, 40) });
}

function onPlayerMessage(msg) {
  if (msg?.t === 'view') {
    player.view = msg.view;
    player.slot = msg.slot;
    renderView();
  } else if (msg?.t === 'full') {
    player.full = true;
    player.conn?.close();
    renderStatus('La partie est déjà complète avec deux joueurs.', true);
  }
}

function renderStatus(text, withRetry = false) {
  player.tone = null;
  render(`
    <div class="pad center" data-key="status">
      <div class="brand">Canapé<span>.</span></div>
      ${withRetry ? '' : '<div class="spinner"></div>'}
      <p class="status">${esc(text)}</p>
      ${withRetry ? '<button class="btn primary" data-id="__retry">Réessayer</button>' : ''}
    </div>`);
}

function cellHtml(cell) {
  const inner = cell.html ?? esc(cell.label ?? '');
  return cell.id
    ? `<button class="${esc(cell.cls)}" data-id="${esc(cell.id)}">${inner}</button>`
    : `<div class="${esc(cell.cls)}">${inner}</div>`;
}

function renderView() {
  const v = player.view || {};
  const grid = v.grid
    ? `<div class="gb ${esc(v.grid.cls)}"${v.grid.style ? ` style="${esc(v.grid.style)}"` : ''}>${v.grid.cells.map(cellHtml).join('')}</div>`
    : '';
  const input = v.input
    ? `<form class="pform" data-act="${esc(v.input.id)}">
        <input name="value" maxlength="${v.input.maxlength || 40}" placeholder="${esc(v.input.placeholder || '')}" autocomplete="off" autocapitalize="characters" spellcheck="false">
        <button class="btn primary" type="submit">OK</button>
      </form>`
    : '';
  const buttons = (v.buttons || []).map(b => `
    <button class="btn ${b.tone || ''}${b.selected ? ' selected' : ''}" data-id="${esc(b.id)}"${b.disabled || b.selected ? ' disabled' : ''}>
      <span>${esc(b.label)}</span>${b.sub ? `<small>${esc(b.sub)}</small>` : ''}
    </button>`).join('');

  render(`
    <div class="pad p${player.slot}" data-key="view">
      <div class="phead">
        <div class="brand small">Canapé<span>.</span></div>
        <span class="me">${esc(player.name)}</span>
      </div>
      ${v.title ? `<h1 class="ptitle">${esc(v.title)}</h1>` : ''}
      ${v.text ? `<p class="ptext ${v.tone || ''}">${esc(v.text)}</p>` : ''}
      ${v.error ? `<p class="perror">${esc(v.error)}</p>` : ''}
      ${grid}
      ${v.big ? `<button class="bigtap" data-id="${esc(v.big.id)}" data-fast="1">${esc(v.big.label)}</button>` : ''}
      ${input}
      ${buttons ? `<div class="pbuttons ${v.layout || ''}">${buttons}</div>` : ''}
      ${v.quit ? '<button class="link" data-id="quit">Quitter la partie</button>' : ''}
    </div>`);

  if (v.tone === 'mine' && player.tone !== 'mine') navigator.vibrate?.(60);
  player.tone = v.tone;
}

if (typeof Peer === 'undefined') {
  render('<div class="pad center"><p class="status">Impossible de charger le module réseau. Vérifie la connexion Internet puis recharge la page.</p></div>');
} else if (ROOM) {
  startPlayer();
} else {
  startHost();
}
</script>
</body>
</html>
